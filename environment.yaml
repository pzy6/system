  - conda-forge
dependencies:
  - python=3.9
  - opencv=4.5
  - pytorch=1.10
  - torchvision=0.11
  - openvino=2024.0
  - numpy=1.24
  - scipy=1.9
  - pandas=1.5
  - pyyaml=6.0
  - pydantic=1.10
  - pyqt=5.15
  - matplotlib=3.6
  - scikit-learn=1.2
  - cmake=3.26
  - pybind11=2.10
